name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run the test suite
        run: node tests.js

      - name: Regenerate examples and the landing page
        run: |
          node build-examples.js
          node build-site.js

      - name: Build release artifacts
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node build-release.js --expect-tag $env:GITHUB_REF_NAME
          } else {
            node build-release.js
          }

      - name: Verify checksums
        shell: pwsh
        run: |
          Get-Content dist/SHA256SUMS.txt | ForEach-Object {
            $parts = $_ -split '  ', 2
            $expected = $parts[0]
            $name = $parts[1]
            $actual = (Get-FileHash (Join-Path 'dist' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Checksum mismatch for $name"
            }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azlang-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
